name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.eb-cache\
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup ffmpeg
        run: node scripts/setup-ffmpeg.js

      - name: Setup winCodeSign cache
        run: node scripts/setup-winCodeSign.js

      - name: Build zip package
        run: npm run build:zip

      - name: Build portable exe
        run: npm run build:portable

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-downloader-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: warn
