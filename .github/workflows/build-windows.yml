name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.eb-cache\
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup ffmpeg
        run: node scripts/setup-ffmpeg.js

      - name: Setup winCodeSign cache
        run: node scripts/setup-winCodeSign.js

      - name: Build zip package
        run: npm run build:zip

      - name: Build portable exe
        run: npm run build:portable

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-downloader-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: warn

      - name: Prepare release assets
        run: node scripts/prepare-release-assets.js

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.1.1 --title "红果短剧下载器 v1.1.1" --notes "自制构建 v1.1.1，基于 zhenyong97/hongguo-downloader v1.1.0，接口与数据目录与原版一致。绿色版 zip 解压后双击 红果短剧下载器.exe 运行；便携版 exe 双击直接运行。" dist/release/hongguo-downloader-1.1.1-win-x64.zip dist/release/hongguo-downloader-1.1.1-portable.exe
